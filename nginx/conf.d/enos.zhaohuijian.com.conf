# 80: ACME + 跳转（浏览器访问也会先到 443，但证书续期需要 80）
server {
    listen 80;
    server_name enos.zhaohuijian.com; # 你的域名

    # 1. Certbot 验证专用路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 2. 强制跳转 HTTPS (一旦证书生成后取消注释)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
  listen 443 ssl;
  http2 on;
  server_name enos.zhaohuijian.com;

  ssl_certificate     /etc/letsencrypt/live/enos.zhaohuijian.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/enos.zhaohuijian.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    # 容器内 www 挂载为 /usr/share/nginx/html，实际页面在 www/html → /usr/share/nginx/html/html
    root /usr/share/nginx/enos.zhaohuijian.com;
    index index.html index.htm;
    
    # 处理 SPA 单页应用 (React/Vue) 的路由问题
    try_files $uri $uri/ /index.html; 
  }
}
