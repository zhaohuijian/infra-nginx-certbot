# 80: ACME + 跳转（浏览器访问也会先到 443，但证书续期需要 80）
server {
    listen 80;
    server_name nextdemo.zhaohuijian.com; # 你的域名

    # 1. Certbot 验证专用路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 2. 强制跳转 HTTPS (一旦证书生成后取消注释)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
  listen 443 ssl;
  http2 on;
  server_name nextdemo.zhaohuijian.com;

  ssl_certificate     /etc/letsencrypt/live/nextdemo.zhaohuijian.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/nextdemo.zhaohuijian.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    proxy_pass http://localhost:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
