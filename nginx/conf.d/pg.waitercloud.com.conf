# pg.waitercloud.com — 仅为 Postgres/PgBouncer 申请 Let's Encrypt（HTTP-01）
# 数据库协议走 5432 原生 TLS，本 vhost 不反代 Postgres。
# 443 使用 ssl_reject_handshake：无需证书文件，避免申请前 nginx -t 失败。

server {
    listen 80;
    server_name pg.waitercloud.com;

    location ^~ /.well-known/acme-challenge/ {
        access_log off;
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 444;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name pg.waitercloud.com;
    ssl_reject_handshake on;
}
