services:
  nginx:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: nginx:1.31.0-alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro # 主配置
      - ./nginx/conf.d:/etc/nginx/conf.d:ro # 站点配置
      - ./certbot/conf:/etc/letsencrypt:ro # 证书配置
      - ./certbot/www:/var/www/certbot:ro # ACME 验证目录
      - ./nginx/ssl:/etc/nginx/ssl-params:ro # SSL 选项与 DH 参数（避免在只读 /etc/letsencrypt 下叠加挂载导致 mount 失败）
      - certbot-reload-trigger:/var/run/certbot-reload:rw # 续期触发器
      # VPN 静态站点
      - /opt/apps/vpn/html:/usr/share/nginx/html:ro
      # wordpress 静态站点
      - www_zhaohuijian_com_html:/var/www/html:ro # 静态站点
      - /opt/apps/www_zhaohuijian_com/wp-content:/var/www/html/wp-content:ro

    # 只保留“检测触发器 -> 校验配置 -> reload”这一条链路
    command: >
      /bin/sh -c '
        set -eu;
        # 启动前先做一次语法校验，避免带病启动
        nginx -t;
        while :; do
          if [ -f /var/run/certbot-reload/reload.flag ]; then
            # reload 前校验配置（企业护栏）
            if nginx -t; then
              nginx -s reload;
              rm -f /var/run/certbot-reload/reload.flag;
            else
              echo "[nginx] nginx -t failed, skip reload";
              # 失败时不删除 flag，便于你排障后手动修复再触发
              sleep 10;
            fi
          fi
          sleep 60;
        done &
        nginx -g "daemon off;"
      '
    networks:
      - proxy-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:81/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # 可选：保证 certbot 写完文件再启动 nginx（非必须，但更稳）
    depends_on:
      certbot:
        condition: service_started

  certbot:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    image: certbot/certbot:v5.6.0
    container_name: certbot
    restart: always
    volumes:
      - ./certbot/conf:/etc/letsencrypt:rw # 证书配置
      - ./certbot/www:/var/www/certbot:rw # ACME 验证目录
      - certbot-reload-trigger:/var/run/certbot-reload:rw # 续期触发器

    # 关键点：deploy-hook 仅在“证书真正续期并部署后”执行
    entrypoint: >
      /bin/sh -c '
        set -eu;
        trap "exit 0" TERM INT;
        while :; do
          # 只在证书实际更新时触发（deploy-hook）
          certbot renew --webroot -w /var/www/certbot --quiet \
            --deploy-hook "touch /var/run/certbot-reload/reload.flag";
          sleep 12h & wait $!;
        done
      '
    networks:
      - proxy-internal
    healthcheck:
      test: ["CMD-SHELL", "certbot certificates >/dev/null 2>&1 || exit 0"]
      interval: 300s
      timeout: 10s
      retries: 2
      start_period: 30s

volumes:
  # 续期触发器
  certbot-reload-trigger:
  # wordpress 静态站点
  www_zhaohuijian_com_html:
    external: true
    name: www_zhaohuijian_com_html
networks:
  proxy-internal:
    external: true
