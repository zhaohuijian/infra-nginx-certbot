# 将本项目部署到远端服务器：runner checkout 后 rsync 同步到服务器，再 SSH 执行 docker compose
# 服务器无需能访问 GitHub；证书等持久化数据保留在服务器（不覆盖 certbot/conf、certbot/www）
# 需在仓库 Settings → Secrets and variables → Actions 中配置：
#   SSH_PRIVATE_KEY  - deploy 用户私钥完整内容（含 -----BEGIN/END-----）
#   DEPLOY_HOST      - 服务器 IP 或域名
# 可选：DEPLOY_USER（默认 deploy）、DEPLOY_PORT（默认 22）、REPO_PATH（服务器上部署路径）
name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
  DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
  REPO_PATH: ${{ vars.REPO_PATH || '~/infra-nginx-certbot' }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
        env:
          DEPLOY_PORT: ${{ env.DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      - name: Rsync to server
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=accept-new -p $DEPLOY_PORT" \
            --exclude='.git' \
            --exclude='certbot/conf' \
            --exclude='certbot/www' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$REPO_PATH/"
        env:
          DEPLOY_USER: ${{ env.DEPLOY_USER }}
          DEPLOY_PORT: ${{ env.DEPLOY_PORT }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          REPO_PATH: ${{ env.REPO_PATH }}

      - name: Prepare and start on server
        run: |
          ssh -o StrictHostKeyChecking=accept-new -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "set -e
            cd $REPO_PATH
            mkdir -p certbot/conf certbot/www
            if [ ! -f .env ]; then
              echo '>>> .env 不存在，从 .env.example 复制（请登录服务器补全配置后重启）'
              cp -n .env.example .env || true
            fi
            echo '>>> ensure nginx/ssl TLS params'
            ./scripts/ensure-ssl-params.sh || true
            echo '>>> docker compose up'
            docker compose pull
            docker compose up -d
            echo '>>> deploy done'
          "
        env:
          DEPLOY_USER: ${{ env.DEPLOY_USER }}
          DEPLOY_PORT: ${{ env.DEPLOY_PORT }}
          REPO_PATH: ${{ env.REPO_PATH }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}